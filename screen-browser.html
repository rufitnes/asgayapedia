<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asgaya Screen Browser - Flow Prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            color: rgba(255,255,255,0.9);
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .flow-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .flow-button {
            background: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .flow-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .flow-button.active {
            background: #4CAF50;
            color: white;
        }

        .screens-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .screen-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            cursor: pointer;
        }

        .screen-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .screen-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            font-weight: 600;
        }

        .screen-title {
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .screen-flow {
            font-size: 0.85em;
            opacity: 0.9;
        }

        .screen-body {
            padding: 20px;
            background: #f8f9fa;
            min-height: 400px;
        }

        .screen-wireframe {
            background: white;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.75em;
            line-height: 1.4;
            white-space: pre;
            overflow-x: auto;
        }

        .screen-notes {
            margin-top: 15px;
            padding: 12px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 4px;
            font-size: 0.85em;
        }

        .screen-interactions {
            margin-top: 15px;
            padding: 12px;
            background: #d1ecf1;
            border-left: 4px solid #17a2b8;
            border-radius: 4px;
            font-size: 0.85em;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: sticky;
            top: 0;
            right: 0;
            background: #f44336;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 1.1em;
            border-radius: 0 20px 0 0;
            z-index: 10;
            float: right;
        }

        .navigation-arrows {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: #f8f9fa;
            border-top: 1px solid #dee2e6;
        }

        .nav-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .nav-button:hover {
            background: #764ba2;
        }

        .nav-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .legend {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .legend h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .legend-item {
            display: inline-block;
            margin-right: 20px;
            margin-bottom: 10px;
        }

        .legend-color {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            margin-right: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Asgaya Screen Browser</h1>
        <p class="subtitle">Navigate through all user flows - Click any screen to expand</p>

        <div class="legend">
            <h3>📚 Flows:</h3>
            <div class="legend-item">
                <span class="legend-color" style="background: #2196F3;"></span>
                <span>Sender (Remittance)</span>
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background: #4CAF50;"></span>
                <span>Recipient</span>
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background: #FF9800;"></span>
                <span>Merchant</span>
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background: #9C27B0;"></span>
                <span>BCH Payment</span>
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background: #F44336;"></span>
                <span>LP (Liquidity Provider)</span>
            </div>
        </div>

        <div class="flow-selector">
            <button class="flow-button active" data-flow="all">All Flows</button>
            <button class="flow-button" data-flow="sender">Sender</button>
            <button class="flow-button" data-flow="recipient">Recipient</button>
            <button class="flow-button" data-flow="merchant">Merchant</button>
            <button class="flow-button" data-flow="bch-payment">BCH Payment</button>
            <button class="flow-button" data-flow="lp">LP</button>
        </div>

        <div class="screens-grid" id="screensGrid"></div>
    </div>

    <div class="modal" id="screenModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕ Close</button>
            <div id="modalBody"></div>
            <div class="navigation-arrows">
                <button class="nav-button" id="prevButton" onclick="navigateScreen(-1)">← Previous</button>
                <button class="nav-button" id="nextButton" onclick="navigateScreen(1)">Next →</button>
            </div>
        </div>
    </div>

        let currentFilter = 'all';
        let currentModalIndex = -1;

        function getFlowColor(flow) {
            const colors = {
                'sender': '#2196F3',
                'recipient': '#4CAF50',
                'merchant': '#FF9800',
                'bch-payment': '#9C27B0',
                'lp': '#F44336'
            };
            return colors[flow] || '#666';
        }

        function renderScreens() {
            const grid = document.getElementById('screensGrid');
            const filtered = currentFilter === 'all'
                ? screens
                : screens.filter(s => s.flow === currentFilter);

            grid.innerHTML = filtered.map((screen, index) => `
                <div class="screen-card" onclick="openModal(${screens.indexOf(screen)})">
                    <div class="screen-header" style="background: ${getFlowColor(screen.flow)}">
                        <div class="screen-title">${screen.flow.toUpperCase()} - ${screen.title}</div>
                        <div class="screen-flow">Screen #${screen.number}</div>
                    </div>
                    <div class="screen-body">
                        <div class="screen-wireframe">${screen.wireframe}</div>
                    </div>
                </div>
            `).join('');
        }

        function openModal(index) {
            currentModalIndex = index;
            const screen = screens[index];
            const modal = document.getElementById('screenModal');
            const modalBody = document.getElementById('modalBody');

            modalBody.innerHTML = `
                <div class="screen-header" style="background: ${getFlowColor(screen.flow)}">
                    <div class="screen-title">${screen.flow.toUpperCase()} - ${screen.title}</div>
                    <div class="screen-flow">Screen #${screen.number}</div>
                </div>
                <div class="screen-body">
                    <div class="screen-wireframe">${screen.wireframe}</div>
                    ${screen.interactions ? `
                        <div class="screen-interactions">
                            <strong>🎯 Interactions:</strong><br>
                            ${screen.interactions}
                        </div>
                    ` : ''}
                    ${screen.notes ? `
                        <div class="screen-notes">
                            <strong>💡 Notes:</strong><br>
                            ${screen.notes}
                        </div>
                    ` : ''}
                </div>
            `;

            updateNavigationButtons();
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('screenModal').classList.remove('active');
        }

        function navigateScreen(direction) {
            const newIndex = currentModalIndex + direction;
            if (newIndex >= 0 && newIndex < screens.length) {
                openModal(newIndex);
            }
        }

        function updateNavigationButtons() {
            document.getElementById('prevButton').disabled = currentModalIndex === 0;
            document.getElementById('nextButton').disabled = currentModalIndex === screens.length - 1;
        }

        // Flow selector buttons
        document.querySelectorAll('.flow-button').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.flow-button').forEach(b => b.classList.remove('active'));
                button.classList.add('active');
                currentFilter = button.dataset.flow;
                renderScreens();
            });
        });

        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if (e.key === 'ArrowLeft') navigateScreen(-1);
            if (e.key === 'ArrowRight') navigateScreen(1);
        });

        // Initial render
        renderScreens();
    </script>
