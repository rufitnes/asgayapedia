site_name: Asgaya Documentation
site_description: BCH covenant-based remittance protocol for Spain-Venezuela corridor
site_url: https://docs.asgaya.org
repo_url: https://github.com/rufitnes/asgayapedia
repo_name: rufitnes/asgayapedia
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant       # Instant page loads
    - navigation.tracking      # URL hash updates on scroll
    - navigation.tabs          # Top-level tabs
    - navigation.sections      # Collapsible sections in sidebar
    - navigation.breadcrumbs   # Breadcrumb trail
    - navigation.top           # Back-to-top button
    - search.highlight         # Highlight search terms
    - search.suggest           # Search suggestions
    - content.code.copy        # Copy button on code blocks
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  font: false  # Disable Google Fonts to avoid fonts.gstatic.com 404s

extra_css:
  - stylesheets/bch-colors.css

plugins:
  - search:
      lang: [en, es]
  - llmstxt-md:
      enable_markdown_urls: true
      enable_llms_txt: true
      enable_llms_full: true
      enable_copy_button: true
      sections:
        Documentation:
          - "*.md"
          - "**/*.md"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list
  - md_in_html
  - toc:
      permalink: true

